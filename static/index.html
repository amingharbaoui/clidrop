<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <link href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" rel="stylesheet"/>
    <link href="https://unpkg.com/dropzone@5/dist/min/dropzone.min.css" rel="stylesheet"
          type="text/css"/>
    <link href="/styles.css" rel="stylesheet">
    <title>clidrop</title>
</head>
<body>
<div class="container_centered">
    <p class="text_top">You can transfer your files using one of the following
        options:</p>
    <div class="container">
        <div class="container_left">
            <div class="container_header_left">
                <i class="hgi hgi-stroke hgi-cursor-02"></i>
                <h2><span class="cli_text">cli</span>ck&get</h2>
            </div>

            <div class="body_left_container">
                <div class="button_left_container">
                    <input class="input_left" hidden="hidden" multiple type="file">
                    <button class="button_left" type="button">
                        <svg
                                aria-hidden="true"
                                fill="none"
                                stroke="#056dfa"
                                stroke-width="2"
                                viewBox="0 0 24 24"
                                xmlns="http://www.w3.org/2000/svg"
                        >
                            <path
                                    d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125"
                                    stroke="#fffffff"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                            ></path>
                            <path
                                    d="M17 15V18M17 21V18M17 18H14M17 18H20"
                                    stroke="#fffffff"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    stroke-width="2"
                            ></path>
                        </svg>
                        <span class="button_left_text">Upload</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="container_right">
            <div class="container_header_right qr_code__frame">
                <h2>drag&<span class="drop_text">drop</span></h2>
            </div>
            <form action="/upload" class="dropzone" id="my-awesome-dropzone"></form>
        </div>
    </div>
</div>
<script src="https://unpkg.com/dropzone@5/dist/min/dropzone.min.js"></script>
<script src="/dropzone_config.js"></script>
<script src="/app.js?v=2"></script>
</body>
</html>
